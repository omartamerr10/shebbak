<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shebbak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: a single centred column like a cinema box-office window. A sticky marquee bar on top,
   the search ticket below it, then the guess board where every guess is a row of five clue tiles. */
:root{
  --hall:#170d0c;        /* page ground: dark cinema hall */
  --seat:#241513;        /* raised surfaces */
  --seat-2:#33201c;      /* inputs, hover, empty tiles */
  --line:#4a2f29;
  --paper:#f6ead6;       /* text */
  --paper-dim:#bda48f;   /* secondary text */
  --brass:#e8b04a;       /* accent, marquee lights */
  --ok:#2f9a6c;          /* exact match */
  --near:#e3a72f;        /* close */
  --near-ink:#2b1a07;
  --miss:#3d302d;        /* no match */
  --red:#b7372a;         /* poster red */
  --f-display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--hall)}
body{margin:0;background:var(--hall);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px;
  background-image:radial-gradient(1200px 500px at 50% -200px,rgba(232,176,74,.10),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hall)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
[dir="rtl"] .ltr-only{display:none}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--hall) 80%,transparent);padding-block:12px 10px;
  display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:baseline;gap:8px;margin-inline-end:auto;min-width:0}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;color:var(--brass);letter-spacing:.01em;
  text-shadow:0 0 16px rgba(232,176,74,.35)}
.logo span{font-family:var(--f-display);font-size:22px;color:var(--paper)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--seat);border:1px solid var(--line);flex:none}
.iconbtn:hover{background:var(--seat-2)}
.iconbtn svg{width:20px;height:20px;stroke:var(--paper);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.langbtn{font-weight:600;font-size:14px;width:auto;padding:0 14px;border-radius:999px}

/* Marquee strip */
.marquee{position:relative;border:2px solid var(--brass);border-radius:var(--r);padding:16px 18px;background:linear-gradient(180deg,var(--seat),var(--hall));
  display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:center}
.marquee::before,.marquee::after{content:"";position:absolute;inset-inline:12px;height:6px;
  background:radial-gradient(circle,var(--brass) 0 2px,transparent 2.6px) 0 0/14px 6px repeat-x;opacity:.85}
.marquee::before{top:4px}.marquee::after{bottom:4px}
.marquee .t{font-family:var(--f-display);font-size:26px;line-height:1.15;text-wrap:balance}
.marquee .s{color:var(--paper-dim);font-size:14px;margin-top:2px}
.modes{display:inline-flex;background:var(--hall);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{padding:8px 16px;border-radius:999px;font-size:14px;color:var(--paper-dim);white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--brass);color:#2a1606;font-weight:600}

/* Era tabs */
.eras{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eras button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--seat);text-align:start;min-width:0}
.eras button:hover{background:var(--seat-2)}
.eras b{font-family:var(--f-display);font-weight:400;font-size:clamp(19px,5.4vw,24px);white-space:nowrap;line-height:1.1;color:var(--paper-dim)}
.eras span{font-size:12.5px;color:var(--paper-dim)}
.eras button[aria-selected="true"]{border-color:var(--brass);background:linear-gradient(180deg,rgba(232,176,74,.16),var(--seat))}
.eras button[aria-selected="true"] b{color:var(--brass)}

/* Search ticket */
.ticket{display:grid;gap:10px}
.searchbox{position:relative}
.searchbox input{width:100%;font:inherit;font-size:17px;padding:16px 16px 16px 48px;border-radius:var(--r);border:2px solid var(--line);background:var(--seat-2);color:var(--paper)}
[dir="rtl"] .searchbox input{padding:16px 48px 16px 16px}
.searchbox input::placeholder{color:var(--paper-dim)}
.searchbox input:focus{border-color:var(--brass);outline:none;background:var(--seat)}
.searchbox input:disabled{opacity:.5}
.searchbox .mag{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--paper-dim);fill:none;stroke-width:2}
.kbd{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--paper-dim);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
@media (hover:none){.kbd{display:none}}
.list{position:absolute;z-index:15;inset-inline:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--seat);border:1px solid var(--line);
  border-radius:var(--r);max-height:min(420px,60vh);overflow:auto;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.opt[aria-selected="true"],.opt:hover{background:var(--seat-2)}
.opt.used{opacity:.38;pointer-events:none}
.opt .yr{font-variant-numeric:tabular-nums;font-size:13px;color:#2a1606;background:var(--brass);border-radius:6px;padding:2px 7px;font-weight:600}
.opt .nm{min-width:0}
.opt .nm b{display:block;font-weight:500;line-height:1.3}
.opt .nm small{display:block;color:var(--paper-dim);font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .via{font-size:11.5px;color:var(--brass);white-space:nowrap}
.list .empty{padding:14px;color:var(--paper-dim)}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between}
.reels{display:flex;gap:5px;align-items:center}
.reels i{width:14px;height:20px;border-radius:3px;border:1.5px solid var(--line);background:var(--hall);position:relative}
.reels i.used{background:var(--paper-dim);border-color:var(--paper-dim)}
.reels i.won{background:var(--ok);border-color:var(--ok)}
.count{font-size:13.5px;color:var(--paper-dim)}
.count b{color:var(--paper);font-variant-numeric:tabular-nums}
.hints{display:flex;gap:8px;flex-wrap:wrap}
.hint{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px dashed var(--line);font-size:13px;color:var(--paper-dim);text-align:start;max-width:100%}
.hint:disabled{cursor:not-allowed;opacity:.65}
.hint.ready{border-style:solid;border-color:var(--brass);color:var(--paper);animation:pulse 2s ease-in-out infinite}
.hint.open{border-style:solid;border-color:var(--brass);background:rgba(232,176,74,.12);color:var(--paper);animation:none}
.hint .av{width:24px;height:24px}
.hint .tag{display:inline-block;background:rgba(232,176,74,.18);border-radius:999px;padding:1px 9px;margin:2px 3px}
.hints{flex-direction:column;align-items:flex-start}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(232,176,74,.18)}}

/* Board */
.board{display:flex;flex-direction:column;gap:10px}
.heads{display:none}
.row{background:var(--seat);border-radius:var(--r);padding:10px;display:grid;gap:8px}
.row.example{border:1px dashed var(--line);background:transparent}
.row .film{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;padding-inline:4px}
.row .film b{font-weight:600;font-size:16px}
.row .film span{color:var(--paper-dim);font-size:13.5px}
.row .film em{margin-inline-start:auto;font-style:normal;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{position:relative;border-radius:10px;padding:8px;min-height:86px;min-width:0;display:flex;flex-direction:column;gap:6px;background:var(--miss);
  animation:flip .55s cubic-bezier(.3,.7,.35,1) both;animation-delay:calc(var(--i,0)*140ms);transform-origin:50% 50%}
.row.static .tile{animation:none}
@keyframes flip{from{transform:perspective(600px) rotateX(92deg);filter:brightness(.5)}to{transform:none;filter:none}}
.tile .lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.85;font-weight:500}
[dir="rtl"] .tile .lbl{letter-spacing:0;font-size:12px}
.tile .mark{position:absolute;inset-inline-end:6px;top:6px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(0,0,0,.22)}
.ok{background:var(--ok)}
.near{background:var(--near);color:var(--near-ink)}
.miss{background:var(--miss)}
.tile.g{grid-column:span 2}
.tile.c{grid-column:span 3}
.tile.year .val{font-family:var(--f-display);font-size:30px;line-height:1;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.tile.year .arr{font-family:var(--f-body);font-size:18px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.25);line-height:1.5}
.chip.ok{background:var(--ok);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.tile.g.near{background:#5b4421;color:var(--paper)}
.person{display:flex;align-items:center;gap:8px;min-width:0}
.person .nm{font-size:13px;line-height:1.25;overflow-wrap:anywhere;min-width:0;font-weight:500}
.av{flex:none;width:40px;height:40px;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;background:rgba(0,0,0,.28);
  border:2px solid rgba(255,255,255,.28);font-size:12px;font-weight:600;letter-spacing:.02em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;transition:opacity .3s}
.av img.on{opacity:1}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cast .p{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border-radius:8px;padding:4px 2px;min-width:0}
.cast .p .av{width:42px;height:42px}
.cast .p .nm{font-size:11.5px;line-height:1.2;overflow-wrap:anywhere}
.cast .p.ok .av{border-color:#9ff0c9}
.cast .p.near .av{border-color:#ffd77a}
.cast .p.ok{background:var(--ok)}
.cast .p.near{background:var(--near);color:var(--near-ink)}
.none{font-size:12.5px;opacity:.7}

@media (min-width:800px){
  .heads,.tiles{display:grid;grid-template-columns:1.25fr .7fr 1fr 1fr 2fr;gap:6px}
  .heads{padding-inline:10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim)}
  [dir="rtl"] .heads{letter-spacing:0;font-size:12.5px}
  .tile.g,.tile.c{grid-column:auto}
  .tile .lbl{display:none}
  .tile{min-height:96px;justify-content:center}
}

/* Empty state */
.how3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how3 div{background:var(--seat);border-radius:var(--r);padding:12px;font-size:13.5px;color:var(--paper-dim);min-width:0}
.how3 b{display:block;color:var(--paper);font-size:14.5px;margin-bottom:2px}
.how3 i{font-style:normal;font-family:var(--f-display);color:var(--brass);font-size:22px;line-height:1}
@media (max-width:640px){.how3{grid-template-columns:1fr}}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--paper-dim);font-size:13px}
.linkbtn{color:var(--paper-dim);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.linkbtn.armed{color:var(--brass)}

/* Modals */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,5,4,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--seat);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;animation:rise .25s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.sheet h2{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;color:var(--brass);text-wrap:balance}
.sheet .x{position:absolute;inset-inline-end:12px;top:12px}
.sheet p{margin:6px 0;color:var(--paper-dim)}
.legend{display:grid;gap:8px;margin:12px 0}
.legend div{display:flex;gap:10px;align-items:center}
.legend i{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.rules{margin:10px 0;padding-inline-start:20px;color:var(--paper-dim);display:grid;gap:6px}
.rules b{color:var(--paper);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;background:var(--brass);color:#2a1606;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--brass);box-shadow:inset 0 0 0 1.5px var(--brass)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.reveal{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start;margin:10px 0 4px}
.poster{aspect-ratio:2/3;width:100%;max-width:100%;border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;
  background:linear-gradient(165deg,var(--red),#5a130e 75%);color:#ffe8c0;box-shadow:0 10px 24px rgba(0,0,0,.45);overflow:hidden}
.poster .t{font-family:var(--f-display);font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.poster small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.facts dt{color:var(--paper-dim);font-size:12px;padding-top:2px}
.facts dd{margin:0}
.ft{font-size:19px;font-weight:600;line-height:1.25;margin-bottom:8px}
.ft span{display:block;font-size:14px;font-weight:400;color:var(--paper-dim)}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px;text-align:center}
.statrow b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.statrow span{font-size:12px;color:var(--paper-dim)}
.dist{display:grid;gap:4px;font-size:12.5px}
.dist div{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center}
.dist em{font-style:normal;color:var(--paper-dim);text-align:end;font-variant-numeric:tabular-nums}
.dist s{display:block;text-decoration:none;background:var(--miss);border-radius:4px;padding:1px 8px;text-align:end;min-width:24px;font-variant-numeric:tabular-nums}
.dist s.me{background:var(--ok)}
.next{margin-top:12px;color:var(--paper-dim);font-size:13.5px}
.next b{color:var(--paper);font-variant-numeric:tabular-nums}
.toast{min-height:1.4em;color:var(--brass);font-size:13.5px;margin-top:6px}
.copyarea{width:100%;margin-top:8px;background:var(--hall);color:var(--paper);border:1px solid var(--line);border-radius:8px;font:12px/1.4 ui-monospace,monospace;padding:8px}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--paper-dim);margin-top:8px}
.toggle input{width:18px;height:18px;accent-color:var(--brass)}
@media (prefers-reduced-motion:reduce){.tile,.sheet,.scrim,.hint.ready{animation:none}}
@media (max-width:520px){
  .logo h1{font-size:28px}.logo span{font-size:18px}
  .marquee{grid-template-columns:1fr}
  .marquee .t{font-size:22px}
  .reveal{grid-template-columns:84px 1fr}
}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="logo"><h1 id="logoEn">Shebbak</h1><span>شبّاك</span></div>
    <button class="iconbtn langbtn" id="langBtn" aria-label="Switch language">عربي</button>
    <button class="iconbtn" id="statsBtn" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button class="iconbtn" id="helpBtn" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.9"/><path d="M12 17.2h.01"/></svg></button>
  </header>

  <nav class="eras" role="tablist" aria-label="Era">
    <button id="eAll" role="tab" aria-selected="true"><b id="eAllT">All eras</b><span id="eAllS">1949 – 2026</span></button>
    <button id="eNew" role="tab" aria-selected="false"><b id="eNewT">2000 – 2026</b><span id="eNewS">Modern films only</span></button>
  </nav>

  <section class="marquee">
    <div>
      <div class="t" id="mqTitle">Guess today's Egyptian film</div>
      <div class="s" id="mqSub">10 tries · a new film every day at midnight, Cairo time</div>
    </div>
    <div class="modes" role="group" aria-label="Mode">
      <button id="mDaily" aria-pressed="true">Today</button>
      <button id="mPractice" aria-pressed="false">Practice</button>
    </div>
  </section>

  <section class="ticket">
    <div class="searchbox">
      <svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="list" aria-autocomplete="list">
      <span class="kbd" aria-hidden="true">/</span>
      <ul class="list" id="list" role="listbox" hidden></ul>
    </div>
    <div class="tray">
      <div class="count"><span id="countTxt"></span></div>
      <div class="reels" id="reels" aria-hidden="true"></div>
    </div>
    <div class="hints" id="hints"></div>
  </section>

  <section class="board" aria-live="polite">
    <div class="heads" id="heads"></div>
    <div id="rows" class="board"></div>
  </section>

  <div class="foot">
    <button class="linkbtn" id="giveup"></button>
    <span id="libTxt"></span>
  </div>
</div>

function save(){mode==='daily'?store.set(K().d+today,state):store.set(K().p,state)}

function guess(id){
  if(state.done||state.g.includes(id))return;
  state.g.push(id);lastAnimated=id;
  const won=id===answer.id;
  if(won||state.g.length>=10)finish(won);
  save();render();
  if(state.done)setTimeout(()=>openResult(),matchMedia('(prefers-reduced-motion:reduce)').matches?100:1100);
}
function finish(won){
  state.done=true;state.won=won;
  if(mode!=='daily')return;
  const s=getStats();if(s.last===today)return;
  s.played++;
  if(won){s.won++;const y=new Date(LAUNCH+(dayIndex(today)-1)*864e5).toISOString().slice(0,10);s.streak=(s.last===y)?s.streak+1:1;s.best=Math.max(s.best,s.streak);s.dist[state.g.length-1]++}
  else{s.streak=0;s.dist[10]++}
  s.last=today;store.set(K().s,s);
}

// ---------- compare ----------
function roleIn(f,p){if(p==null)return null;if(f.lead===p)return'lead';if(f.co.includes(p))return'co';if(f.dir.includes(p))return'dir';return null}
function compare(g,a){
  const hit=g.g.map(x=>a.g.includes(x));
  const same=g.g.length&&g.g.length===a.g.length&&hit.every(Boolean);
  const genres={st:same?'ok':hit.some(Boolean)?'near':'miss',chips:g.g.map((x,i)=>({x,ok:hit[i]}))};
  const dy=a.year-g.year;
  const year={st:dy===0?'ok':Math.abs(dy)<=5?'near':'miss',arr:dy>0?'↑':dy<0?'↓':''};
  const dir={st:g.dir.some(d=>a.dir.includes(d))?'ok':g.dir.some(d=>a.cast.includes(d))?'near':'miss'};
  const lr=roleIn(a,g.lead);const lead={st:lr==='lead'?'ok':lr?'near':'miss'};
  const co=g.co.map(p=>{const r=roleIn(a,p);return{p,st:r==='co'?'ok':r?'near':'miss'}});
  const coSt=co.some(c=>c.st==='ok')?'ok':co.some(c=>c.st==='near')?'near':'miss';
  return{genres,year,dir,lead,co,coSt};
}

// ---------- photos ----------
const PH=store.get('shebbak:ph',{});let photosOff=false,active=0;const queue=[];const waiting={};
const OKDESC=/(actor|actress|singer|director|film|comedian|dancer|screenwriter|producer|ممثل|ممثلة|مخرج|مخرجة|مغني|مغنية|مطرب|مطربة|راقصة|فنان|فنانة|كوميدي)/i;
async function lookup(p){
  if(p.ar){
    const u=`https://ar.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|pageterms&piprop=thumbnail&pithumbsize=200&wbptterms=description&titles=${encodeURIComponent(p.ar)}`;
    const j=await(await fetch(u)).json();const pg=Object.values(j.query?.pages||{})[0];
    if(pg?.thumbnail?.source&&OKDESC.test((pg.terms?.description||[''])[0]))return pg.thumbnail.source;
  }
  const u=`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit=5&gsrsearch=${encodeURIComponent(p.en+' Egyptian')}&prop=pageimages|pageterms&piprop=thumbnail&pithumbsize=200&wbptterms=description`;
  const j=await(await fetch(u)).json();const pages=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index);
  const toks=norm(p.en).split(' ');const last=toks[toks.length-1];
  for(const pg of pages){const t=norm(pg.title);const d=(pg.terms?.description||[''])[0];if(pg.thumbnail&&t.includes(last)&&t.includes(toks[0])&&OKDESC.test(d))return pg.thumbnail.source}
  return '';
}
function pump(){
  while(active<4&&queue.length&&!photosOff){
    const pi=queue.shift();active++;
    lookup(P[pi]).then(url=>{PH[P[pi].en]=url;store.set('shebbak:ph',PH);apply(pi)})
      .catch(()=>{photosOff=true})
      .finally(()=>{active--;delete waiting[pi];pump()});
  }
}
function apply(pi){
  const url=PH[P[pi].en];if(!url)return;
  document.querySelectorAll(`.av[data-p="${pi}"]`).forEach(el=>{
    if(el.querySelector('img'))return;
    const im=new Image();im.alt='';im.referrerPolicy='no-referrer';im.decoding='async';
    im.onload=()=>im.classList.add('on');im.onerror=()=>im.remove();im.src=url;el.appendChild(im);
  });
}
function hydrate(root){
  root.querySelectorAll('.av[data-p]').forEach(el=>{
    const pi=+el.dataset.p;const name=P[pi].en;
    if(name in PH){apply(pi);return}
    if(!photosOff&&!waiting[pi]){waiting[pi]=1;queue.push(pi)}
  });pump();
}

// ---------- render helpers ----------
const nameOf=pi=>pi==null?'':(lang==='ar'?(P[pi].ar||P[pi].en):P[pi].en);
const titleOf=f=>lang==='ar'?(f.ar||f.en):f.en;
const altTitle=f=>lang==='ar'?f.en:(f.ar||'');
const yearTxt=y=>lang==='ar'?AR_DIG(y):String(y);
const genreTxt=g=>lang==='ar'?(GEN_AR[GEN[g]]||GEN[g]):GEN[g];
const MARK={ok:'✓',near:'≈',miss:'✕'};
const av=(pi,cls='')=>`<span class="av ${cls}" data-p="${pi}" aria-hidden="true">${esc(initials(P[pi].en))}</span>`;
function personTile(pi,st,i,lbl,key){
  return `<div class="tile ${st}" style="--i:${i}" aria-label="${esc(lbl)}: ${esc(pi==null?'—':nameOf(pi))}"><span class="lbl">${lbl}</span><span class="mark">${MARK[st]}</span>
   ${pi==null?`<span class="none">—</span>`:`<div class="person">${av(pi)}<span class="nm">${esc(nameOf(pi))}</span></div>`}</div>`;
}
function rowHTML(g,c,{animate,example}){
  const l=L().lbl,t=L();
  const yl=c.year.arr?(c.year.arr==='↑'?t.later:t.earlier):'';
  return `<article class="row ${animate?'':'static'} ${example?'example':''}">
   <div class="film"><b>${esc(titleOf(g))}</b><span>${esc(altTitle(g))}</span>${example?`<em>${t.example}</em>`:''}</div>
   <div class="tiles">
    <div class="tile g ${c.genres.st}" style="--i:0"><span class="lbl">${l.g}</span><span class="mark">${MARK[c.genres.st]}</span>
      <div class="chips">${c.genres.chips.length?c.genres.chips.map(x=>`<span class="chip ${x.ok?'ok':''}">${esc(genreTxt(x.x))}</span>`).join(''):`<span class="none">${t.nog}</span>`}</div></div>
    <div class="tile year ${c.year.st}" style="--i:1" aria-label="${l.y} ${g.year} ${yl}"><span class="lbl">${l.y}</span><span class="mark">${MARK[c.year.st]}</span>
      <span class="val">${yearTxt(g.year)}${c.year.arr?`<span class="arr" title="${yl}">${c.year.arr}</span>`:''}</span></div>
    ${personTile(g.dir[0],c.dir.st,2,l.d)}
    ${personTile(g.lead,c.lead.st,3,l.l)}
    <div class="tile c ${c.co.length?'':'miss'}" style="--i:4;background:var(--seat-2)"><span class="lbl">${l.c}</span>
      ${c.co.length?`<div class="cast">${c.co.map(x=>`<div class="p ${x.st}" aria-label="${esc(nameOf(x.p))}: ${x.st}">${av(x.p)}<span class="nm">${esc(nameOf(x.p))}</span></div>`).join('')}</div>`:`<span class="none">${t.noco}</span>`}
    </div>
   </div></article>`;
}

function render(){
  const t=L(),n=state.g.length;
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#langBtn').textContent=lang==='ar'?'English':'عربي';
  $('#eAll').setAttribute('aria-selected',era==='all');$('#eNew').setAttribute('aria-selected',era==='new');
  $('#eAllT').textContent=t.eraAll;$('#eAllS').textContent=t.eraAllS;$('#eNewT').textContent=t.eraNew;$('#eNewS').textContent=t.eraNewS;
  $('#mDaily').textContent=t.today;$('#mPractice').textContent=t.practice;
  $('#mDaily').setAttribute('aria-pressed',mode==='daily');$('#mPractice').setAttribute('aria-pressed',mode==='practice');
  const num=dayIndex(today)+1;
  const tt=era==='all'?t.title:t.titleN;
  $('#mqTitle').textContent=mode==='daily'?(lang==='ar'?`${tt} · رقم ${AR_DIG(num)}`:`${tt} · #${num}`):`${t.titleP} · ${era==='all'?t.eraAll:t.eraNew}`;
  $('#mqSub').textContent=mode==='daily'?t.sub:t.subP;
  $('#q').placeholder=t.ph;$('#q').disabled=state.done;
  $('#countTxt').innerHTML=state.done?t.done:t.guessN(lang==='ar'?AR_DIG(n+1):n+1);
  $('#reels').innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<n?(state.won&&i===n-1?'won':'used'):''}"></i>`).join('');
  $('#heads').innerHTML=t.heads.map(h=>`<span>${h}</span>`).join('');
  // hints
  const tg=answer.tags?answer.tags[lang==='ar'?1:0].map(x=>`<span class="tag">${esc(x)}</span>`).join(''):esc(t.noTags);
  const sh=state.h3||starHint();
  const shLbl={lead:t.h3,co:t.h3co,dir:t.h3dir,title:t.h3title}[sh.k];
  const shTxt=sh.k==='title'?esc(titleHintTxt()):`${av(sh.p)} ${esc(nameOf(sh.p))}`;
  const hs=[[0,4,t.h1,castLink()],[1,6,t.h2,tg],[2,8,shLbl,shTxt]];
  $('#hints').innerHTML=hs.map(([i,at,name,txt])=>{
    const open=state.h[i]||state.done,ready=n>=at&&!open;
    const body=open?txt:ready?t.tap:t.lock(lang==='ar'?AR_DIG(at):at);
    return `<button class="hint ${open?'open':ready?'ready':''}" data-h="${i}" ${!open&&!ready?'disabled':''}><b>${name}</b>· ${body}</button>`}).join('');
  // rows
  const rows=$('#rows');
  if(!n&&!state.done){
    const ex=F.find(f=>f.en===(era==='all'?'Cairo Station':'Mafia')),demo=F.find(f=>f.en===(era==='all'?'Struggle in the Valley':'Tito'));
    rows.innerHTML=`<div class="how3"><div><i>١</i><b>${t.e1}</b>${t.e1s}</div><div><i>٢</i><b>${t.e2}</b>${t.e2s}</div><div><i>٣</i><b>${t.e3}</b>${t.e3s}</div></div>`+
      rowHTML(ex,compare(ex,demo),{animate:false,example:true});
  }else{
    rows.innerHTML=state.g.slice().reverse().map(id=>rowHTML(F[id],compare(F[id],answer),{animate:id===lastAnimated})).join('');
  }
  lastAnimated=-1;
  $('#giveup').textContent=t.give;$('#giveup').classList.remove('armed');$('#giveup').hidden=state.done;
  const EF=F.filter(inEra),ys=EF.map(f=>f.year);$('#libTxt').textContent=t.lib(lang==='ar'?AR_DIG(EF.length):EF.length,yearTxt(Math.min(...ys)),yearTxt(Math.max(...ys)));
  hydrate(document);
}

// ---------- star hint: lead, or the next person the player hasn't seen ----------
function starHint(){
  const a=answer,seen=new Set();
  state.g.forEach(id=>{F[id].cast.forEach(p=>seen.add(p));F[id].dir.forEach(p=>seen.add(p))});
  if(a.lead!=null&&!seen.has(a.lead))return{k:'lead',p:a.lead};
  const co=a.co.find(p=>!seen.has(p));if(co!=null)return{k:'co',p:co};
  const d=a.dir.find(p=>!seen.has(p));if(d!=null)return{k:'dir',p:d};
  return{k:'title'};
}
function titleHintTxt(){const ti=titleOf(answer).trim(),w=ti.split(/\s+/).length;return L().titleHint(ti[0],lang==='ar'?AR_DIG(w):w)}

// ---------- cast link hint ----------
function castLink(){
  const t=L(),a=answer;
  const pick=pred=>F.filter(f=>f!==a&&pred(f)).sort((x,y)=>(inEra(y)-inEra(x))||(state.g.includes(x.id)-state.g.includes(y.id))||(y.famous-x.famous)||(x.id-y.id))[0];
  const name=f=>`«${esc(titleOf(f))}» (${yearTxt(f.year)})`;
  let f=pick(f=>f.cast.includes(a.lead));if(f)return t.linkLead(name(f));
  for(const p of a.co){f=pick(f=>f.cast.includes(p));if(f)return t.linkCo(name(f))}
  for(const d of a.dir){f=pick(f=>f.dir.includes(d));if(f)return t.linkDir(name(f))}
  return esc(t.noLink);
}

// ---------- search ----------
const q=$('#q'),list=$('#list');let sel=0,matches=[];
function search(){
  const s=norm(q.value);if(!s){close();return}
  const scored=[];
  for(const f of F){if(!inEra(f))continue;let sc=0;for(const k of f.keys){if(k===s)sc=Math.max(sc,5);else if(k.startsWith(s))sc=Math.max(sc,4);else if(k.split(' ').some(w=>w.startsWith(s)))sc=Math.max(sc,3);else if(s.length>2&&k.includes(s))sc=Math.max(sc,2)}
    if(sc)scored.push({f,sc,via:null})}
  scored.sort((a,b)=>b.sc-a.sc||(b.f.famous-a.f.famous)||a.f.year-b.f.year);
  matches=scored.slice(0,12);sel=matches.findIndex(m=>!state.g.includes(m.f.id));if(sel<0)sel=0;
  if(!matches.length){list.innerHTML=`<li class="empty">${L().noMatch}</li>`}
  else list.innerHTML=matches.map((m,i)=>{const f=m.f;
    return `<li class="opt ${state.g.includes(f.id)?'used':''}" role="option" id="o${i}" aria-selected="${i===sel}" data-id="${f.id}">
      <span class="yr">${yearTxt(f.year)}</span>
      <span class="nm"><b>${esc(titleOf(f))}</b><small>${esc([altTitle(f),nameOf(f.lead)].filter(Boolean).join(' · '))}</small></span>
      ${m.via!=null?`<span class="via">${esc(L().via(nameOf(m.via)))}</span>`:'<span></span>'}</li>`}).join('');
  list.hidden=false;q.setAttribute('aria-expanded','true');q.setAttribute('aria-activedescendant','o'+sel);
}
function close(){list.hidden=true;q.setAttribute('aria-expanded','false')}
function pick(id){q.value='';close();guess(id);if(!state.done)q.focus()}
q.addEventListener('input',search);
q.addEventListener('focus',()=>{if(q.value)search()});
q.addEventListener('keydown',e=>{
  if(list.hidden||!matches.length){if(e.key==='Escape')q.blur();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+matches.length)%matches.length;
    [...list.children].forEach((li,i)=>li.setAttribute('aria-selected',i===sel));q.setAttribute('aria-activedescendant','o'+sel);list.children[sel]?.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();const m=matches[sel];if(m&&!state.g.includes(m.f.id))pick(m.f.id)}
  else if(e.key==='Escape')close();
});
list.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-id]');if(li){e.preventDefault();pick(+li.dataset.id)}});
q.addEventListener('blur',()=>setTimeout(close,150));
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q&&$('#scrim').hidden){e.preventDefault();q.focus()}if(e.key==='Escape'&&!$('#scrim').hidden)closeSheet()});

// ---------- sheets ----------
let tick=null;
function openSheet(html){$('#sheet').innerHTML=`<button class="iconbtn x" aria-label="Close" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`+html;$('#scrim').hidden=false;hydrate($('#sheet'));$('#sheet').querySelector('.btn,[data-close]')?.focus()}
function closeSheet(){$('#scrim').hidden=true;clearInterval(tick)}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim'||e.target.closest('[data-close]'))closeSheet()});
function openHelp(){
  const t=L();
  openSheet(`<h2>${t.howTitle}</h2><p>${t.howIntro}</p>
   <div class="legend"><div><i class="ok">✓</i>${t.legOk}</div><div><i class="near">≈</i>${t.legNear}</div><div><i class="miss">✕</i>${t.legMiss}</div></div>
   <ul class="rules">${t.rules.map(r=>`<li>${r}</li>`).join('')}</ul>
   <p style="font-size:12.5px">${t.photos}</p>
   <div class="actions"><button class="btn" data-close>${t.play}</button></div>`);
}
function statsHTML(highlight){
  const t=L(),s=getStats(),mx=Math.max(1,...s.dist);
  const f=v=>lang==='ar'?AR_DIG(v):v;
  return `<div class="statrow"><div><b>${f(s.played)}</b><span>${t.played}</span></div><div><b>${f(s.played?Math.round(s.won/s.played*100):0)}</b><span>${t.win}</span></div>
   <div><b>${f(s.streak)}</b><span>${t.streak}</span></div><div><b>${f(s.best)}</b><span>${t.best}</span></div></div>
   <div class="dist" aria-label="${t.dist}">${s.dist.map((v,i)=>`<div><em>${i===10?'✕':f(i+1)}</em><s class="${highlight===i?'me':''}" style="width:${Math.max(6,v/mx*100)}%">${f(v)}</s></div>`).join('')}</div>`;
}
function openStats(){openSheet(`<h2>${L().stats} · ${era==='all'?L().eraAll:L().eraNew}</h2>${statsHTML(-1)}<div class="next" id="nextTxt"></div>`);runCountdown()}
function runCountdown(){
  const upd=()=>{const el=$('#nextTxt');if(!el)return;const o=cairoParts();let s=86400-(+o.hour*3600+ +o.minute*60+ +o.second);
    const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');
    el.innerHTML=`${L().next} <b>${h}:${m}:${ss}</b>`;if(cairoDate()!==today){today=cairoDate();if(mode==='daily')load()}};
  upd();clearInterval(tick);tick=setInterval(upd,1000);
}
function shareText(){
  const sq={ok:'🟩',near:'🟨',miss:'⬛'};
  const lines=state.g.map(id=>{const c=compare(F[id],answer);return[c.genres.st,c.year.st,c.dir.st,c.lead.st,c.coSt].map(x=>sq[x]).join('')});
  const tag=era==='new'?' 2000–2026':'';const head=mode==='daily'?`Shebbak شبّاك${tag} #${dayIndex(today)+1}`:`Shebbak شبّاك${tag} (practice)`;
  return `${head} 🎬 ${state.won?state.g.length:'X'}/10\n${lines.join('\n')}`;
}
function openResult(){
  const t=L(),a=answer;
  const facts=`<dl class="facts"><dt>${t.y}</dt><dd>${yearTxt(a.year)}</dd><dt>${t.dir}</dt><dd>${esc(a.dir.map(nameOf).join('، '))||'—'}</dd>
    <dt>${t.cast}</dt><dd>${esc(a.cast.map(nameOf).join(lang==='ar'?'، ':', '))}</dd><dt>${t.gen}</dt><dd>${esc(a.g.map(genreTxt).join(' · '))||'—'}</dd></dl>`;
  openSheet(`<h2>${state.won?t.won(state.g.length):t.lost}</h2>
    <div class="reveal"><div class="poster"><small>${yearTxt(a.year)}</small><span class="t" lang="ar">${esc(a.ar||a.en)}</span><small>${esc(nameOf(a.lead))}</small></div>
      <div style="min-width:0"><div class="ft">${esc(titleOf(a))}<span>${esc(altTitle(a))}</span></div>${facts}</div></div>
    <div class="actions"><button class="btn" id="shareBtn">${t.share}</button><button class="btn ghost" id="againBtn">${mode==='practice'?t.nextP:t.again}</button></div>
    <div class="toast" id="toast" role="status"></div>
    ${mode==='daily'?statsHTML(state.won?state.g.length-1:10)+'<div class="next" id="nextTxt"></div>':`<label class="toggle"><input type="checkbox" id="rare" ${store.get('shebbak:rare',false)?'checked':''}>${t.rare}</label>`}`);
  $('#shareBtn').onclick=async()=>{const txt=shareText();try{await navigator.clipboard.writeText(txt);$('#toast').textContent=t.copied}catch(e){$('#toast').innerHTML=`<textarea class="copyarea" rows="6" readonly>${esc(txt)}</textarea>`;$('#toast textarea').select()}};
  $('#againBtn').onclick=()=>{closeSheet();mode='practice';newPractice();lastAnimated=-1;render();q.focus()};
  const r=$('#rare');if(r)r.onchange=()=>store.set('shebbak:rare',r.checked);
  if(mode==='daily')runCountdown();
}

// ---------- wiring ----------
$('#hints').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b||b.disabled)return;const i=+b.dataset.h;if(!state.h[i]){if(i===2&&!state.h3)state.h3=starHint();state.h[i]=true;save();render()}});
function setEra(e){if(era===e)return;era=e;store.set('shebbak:era',era);q.value='';close();load();if(mode==='daily'&&state.done)setTimeout(openResult,300)}
$('#eAll').onclick=()=>setEra('all');$('#eNew').onclick=()=>setEra('new');
$('#mDaily').onclick=()=>{if(mode!=='daily'){mode='daily';load()}};
$('#mPractice').onclick=()=>{if(mode!=='practice'){mode='practice';load()}};
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';store.set('shebbak:lang',lang);render();if(!$('#scrim').hidden)closeSheet()};
$('#helpBtn').onclick=openHelp;
$('#statsBtn').onclick=()=>state.done&&mode==='daily'?openResult():openStats();
$('#giveup').onclick=e=>{const b=e.currentTarget;if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent=L().give2;setTimeout(()=>{b.classList.remove('armed');b.textContent=L().give},3000);return}
  finish(false);save();render();openResult()};

load();
if(!store.get('shebbak:seen',false)){store.set('shebbak:seen',true);openHelp()}
else if(state.done&&mode==='daily')setTimeout(openResult,300);
</script>
